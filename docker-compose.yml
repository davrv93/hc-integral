services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hc}
      POSTGRES_USER: ${POSTGRES_USER:-hc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hc_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
