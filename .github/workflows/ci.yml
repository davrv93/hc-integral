name: CI

on:
  push:
  pull_request:

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth, api, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: Test
        working-directory: ${{ matrix.service }}
        run: go test ./...
      - name: Vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...
      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build ./...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build
        working-directory: web
        run: npm run build
